name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Mesma versão do `environment.sdk: ^3.12.2` do pubspec.yaml. Fixada de
  # propósito: canal `stable` flutuante faria o build quebrar sozinho num dia
  # em que ninguém mexeu no código.
  FLUTTER_VERSION: '3.44.8'

jobs:
  analise-e-testes:
    name: Análise e testes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependências
        run: flutter pub get

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Coletor de concursos
        run: node --test tool/concursos/*.test.cjs

      # `dart format --set-exit-if-changed` fica FORA do gate de propósito.
      # O código foi escrito no short style (formatter pré-Dart 3.7) e o SDK
      # 3.12.2 usa o tall style: reformatar mexeria em 109 dos 204 arquivos
      # (8.024 linhas), apagando o `git blame` de um projeto cujo maior ativo
      # são os comentários explicando o PORQUÊ de cada decisão. Pior, o próprio
      # formatter colapsa `if (x) continue;` em uma linha e introduz 2 lints
      # de `curly_braces_in_flow_control_structures` — o gate cosmético sujaria
      # o gate real. `flutter analyze` continua bloqueante e cobre o que importa.
      - name: Análise estática
        run: flutter analyze --no-pub

      - name: Testes
        # Exclui os goldens: comparação de pixel depende de fonte e plataforma,
        # e transformar diferença de renderização em build vermelho treina o
        # time a ignorar falha. Eles rodam no job `goldens`, que não bloqueia.
        run: flutter test --exclude-tags screenshots --reporter expanded

  goldens:
    name: Goldens (não bloqueia)
    # As referências foram geradas no Windows; o rasterizador do Linux diverge 2 a 5%.
    runs-on: windows-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Comparação visual
        run: flutter test --tags screenshots --reporter expanded

      - name: Publicar diferenças
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: test/failures/
          if-no-files-found: ignore

  integracao-web:
    name: Integração web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Chrome do runner + ChromeDriver da mesma milestone, só em RUNNER_TEMP.
      # Fonte: storage.googleapis.com/chrome-for-testing-public. Sem action extra.
      - name: ChromeDriver em 4444
        run: |
          set -euo pipefail
          CHROME_BIN=$(command -v google-chrome || command -v google-chrome-stable)
          CHROME_VER=$("$CHROME_BIN" --version | awk '{print $3}')
          echo "Chrome ${CHROME_VER}"
          BASE="https://storage.googleapis.com/chrome-for-testing-public"
          ZIP="${RUNNER_TEMP}/chromedriver.zip"
          if ! curl -fsSL "${BASE}/${CHROME_VER}/linux64/chromedriver-linux64.zip" -o "${ZIP}"; then
            MILESTONE=${CHROME_VER%%.*}
            VER=$(curl -fsSL https://googlechromelabs.github.io/chrome-for-testing/latest-versions-per-milestone-with-downloads.json \
              | python3 -c "import json,sys; print(json.load(sys.stdin)['milestones']['${MILESTONE}']['version'])")
            echo "ChromeDriver da milestone ${MILESTONE}: ${VER}"
            curl -fsSL "${BASE}/${VER}/linux64/chromedriver-linux64.zip" -o "${ZIP}"
          fi
          unzip -q "${ZIP}" -d "${RUNNER_TEMP}/chromedriver"
          "${RUNNER_TEMP}/chromedriver/chromedriver-linux64/chromedriver" --port=4444 &
          echo $! > "${RUNNER_TEMP}/chromedriver.pid"
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4444/status && exit 0
            sleep 0.5
          done
          echo "ChromeDriver não respondeu em 4444" >&2
          exit 1

      - name: Q9 web-server
        run: flutter drive --driver=test_driver/integration_test.dart --target=integration_test/sessao_revisao_test.dart -d web-server --browser-name chrome --no-pub

      - name: Parar ChromeDriver
        if: always()
        run: kill "$(cat "${RUNNER_TEMP}/chromedriver.pid")" || true
